version: '3.9'

services:
  api:
    build: ./api
    container_name: api_container
    env_file:
      - .development.env
    ports:
      - 8000:8000
  
  streamlit:
    build: .
    container_name: streamlit_container
    env_file:
      - .development.env
    ports:
      - 8501:8501
    environment:
      - API_URL=http://api_container:8000
    depends_on:
      - api
